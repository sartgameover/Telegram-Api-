<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a12">
  <title>Староста</title>
  <style>
:root{
  --bg:#0a0a12;--card:#13131f;--card2:#1a1a2b;--line:rgba(255,255,255,.07);
  --text:#ecebff;--mute:#8d8ca8;--acc:#7c6bff;--acc2:#a99bff;
  --green:#3ddc97;--amber:#ffc857;--red:#ff6b7a;--blue:#5aa9ff;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 420px at 50% -120px,rgba(124,107,255,.22),transparent 70%),var(--bg)}
#view{max-width:560px;margin:0 auto;padding:14px 14px calc(92px + var(--safe-b))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc2);text-decoration:none}

.boot{height:70vh;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--mute)}
.logo{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(145deg,#8b7bff,#5b45e8);box-shadow:0 10px 40px rgba(124,107,255,.5)}

/* верхня панель */
.top{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.ava{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:18px;
  background:linear-gradient(145deg,#8b7bff,#5b45e8);flex:none}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--mute);font-size:13px}
.top .grow{flex:1;min-width:0}
.back{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pagehead h1{font-size:22px;font-weight:700}
.lead{color:var(--mute);font-size:13.5px;margin:2px 0 14px}

/* картки */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:15px;font-weight:650;margin-bottom:8px}
.hero{background:linear-gradient(150deg,rgba(124,107,255,.28),rgba(124,107,255,.06) 60%),var(--card);
  border-color:rgba(124,107,255,.35)}
.kicker{font-size:12px;color:var(--acc2);display:flex;align-items:center;gap:6px;font-weight:600}
.kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.kicker.off:before{background:var(--mute);box-shadow:none}
.hero h2{font-size:21px;margin:6px 0 2px;letter-spacing:-.3px;line-height:1.2}
.hero .time{color:var(--mute);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1;font-weight:700}
.stat small{font-size:10.5px;color:var(--mute)}
.stat.g b{color:var(--green)}.stat.a b{color:var(--amber)}.stat.r b{color:var(--red)}.stat.m b{color:#c9c8e0}
.linkrow{margin-top:12px;font-size:13px;color:var(--acc2);font-weight:600;cursor:pointer;display:block}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;min-height:92px;position:relative;text-align:left;border-width:1px}
.tile:active{transform:scale(.98);background:var(--card2)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;margin-bottom:4px;
  background:rgba(124,107,255,.16)}
.tile b{font-size:14.5px}.tile span{font-size:12px;color:var(--mute)}
.tile .badge{position:absolute;top:10px;right:10px}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}

.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;color:var(--mute);font-size:12.5px;font-weight:600}
.sect a{font-size:12.5px}

/* уроки */
.les{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.les:last-child{border-bottom:0}
.les:active{background:var(--card2)}
.num{width:30px;height:30px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--acc2);flex:none}
.les .t{flex:1;min-width:0}
.les .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les .t span{color:var(--mute);font-size:12.5px}
.les.cancelled .t b{text-decoration:line-through;color:var(--mute)}
.pill{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--acc2);white-space:nowrap}
.pill.red{background:rgba(255,107,122,.15);color:var(--red)}
.pill.amb{background:rgba(255,200,87,.15);color:var(--amber)}
.pill.grn{background:rgba(61,220,151,.14);color:var(--green)}
.pill.blu{background:rgba(90,169,255,.15);color:var(--blue)}
.pill.gry{background:rgba(255,255,255,.07);color:var(--mute)}
.sm{font-size:12px;color:var(--mute)}

/* банери */
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--card);font-size:14px}
.banner b{display:block;margin-bottom:2px}
.banner.warn{background:rgba(255,200,87,.1);border-color:rgba(255,200,87,.3)}
.banner.vote{background:rgba(124,107,255,.14);border-color:rgba(124,107,255,.4)}
.banner.sick{background:rgba(255,107,122,.1);border-color:rgba(255,107,122,.3)}
.banner .row{margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* кнопки */
.btn{border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:14.5px}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(145deg,#8b7bff,#6a55f0);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(124,107,255,.35)}
.btn.red{background:rgba(255,107,122,.15);color:var(--red);border-color:rgba(255,107,122,.3)}
.btn.grn{background:rgba(61,220,151,.16);color:var(--green);border-color:rgba(61,220,151,.3)}
.btn.block{display:block;width:100%}
.btn.sm2{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* поля */
label.f{display:block;margin:0 0 12px;font-size:12.5px;color:var(--mute)}
label.f>input,label.f>textarea,label.f>select,input.in,select.in,textarea.in{display:block;width:100%;margin-top:5px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:86px}
input[type=date],input[type=time]{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin:6px 0 12px;color:var(--text)}
.chk input{width:20px;height:20px;accent-color:var(--acc)}

/* сегменти й чипи */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card2);padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:rgba(124,107,255,.25);border-color:var(--acc);color:#fff}

/* тиждень */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:8px 0;text-align:center;cursor:pointer;position:relative}
.day small{display:block;color:var(--mute);font-size:11px;text-transform:lowercase}
.day b{font-size:16px}
.day.on{background:var(--acc);border-color:transparent}
.day.on small{color:#e5e1ff}
.day.today b{color:var(--acc2)}.day.on.today b{color:#fff}
.day i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}
.weekbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.weekbar .btn{padding:7px 13px}

/* учні, журнал */
.stu{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.stu:last-child{border-bottom:0}
.av2{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--acc2);flex:none}
.stu .t{flex:1;min-width:0}.stu .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marks{display:flex;gap:5px}
.mk{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:15px;opacity:.55}
.mk.on{opacity:1;border-color:transparent}
.mk.present.on{background:rgba(61,220,151,.28)}.mk.late.on{background:rgba(255,200,87,.3)}.mk.absent.on{background:rgba(255,107,122,.32)}

/* прогули */
.bar{height:7px;border-radius:9px;background:var(--card2);display:flex;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%}
.sk{padding:12px 14px;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.sk.risk{border-left:3px solid var(--red);background:rgba(255,107,122,.05)}
.sk .l{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* нижня навігація */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;
  padding:8px 10px calc(8px + var(--safe-b));background:rgba(10,10,18,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav a{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;color:var(--mute);cursor:pointer;font-size:11px;font-weight:600}
#nav a i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
#nav a.on{color:var(--acc2);background:rgba(124,107,255,.14)}
#nav a.on i{filter:none;opacity:1}

/* шторки */
.wrap{position:fixed;inset:0;z-index:50;background:rgba(3,3,8,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:8px 16px calc(18px + var(--safe-b));border:1px solid var(--line);animation:up .2s ease-out}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);margin:4px auto 14px}
.sheet h2{font-size:18px;margin-bottom:2px}
.sheet .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.sheet .btn{margin-top:8px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:#2a2a40;color:#fff;
  padding:10px 16px;border-radius:13px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#5b1f2a}

.empty{text-align:center;color:var(--mute);padding:28px 10px}
.empty .big{font-size:34px;margin-bottom:6px}
.file{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin:6px 0;font-size:13.5px}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw{padding:10px 12px;background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.2);border-radius:13px;margin:8px 0;font-size:14px}
.hw small{display:block;color:var(--mute);margin-top:4px}
.ann{padding:12px 14px;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.ann.pin{background:rgba(124,107,255,.08)}
.ann b{display:block}.ann p{color:#cfcee6;font-size:14px;margin-top:3px;white-space:pre-wrap}
.ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ed .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ed input.n{width:54px;text-align:center;font-weight:700}
.ed .del{border:0;background:transparent;color:var(--red);font-size:18px;cursor:pointer;padding:4px 8px}
.ed .var{border-left:3px solid var(--acc);padding-left:10px;margin:8px 0}
.ed .var .sm{margin-bottom:3px;color:var(--acc2);font-weight:600}
.skel{height:86px;border-radius:18px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ribbon{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:60;background:rgba(124,107,255,.92);color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:0 0 10px 10px;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}

</style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <main id="view"><div class="boot"><div class="logo">🎓</div><p>Староста</p></div></main>
    <nav id="nav" hidden>
      <a data-act="go" data-to="home" data-tab="home"><i>🏠</i><span>Головна</span></a>
      <a data-act="go" data-to="students" data-tab="students"><i>👥</i><span>Учні</span></a>
      <a data-act="go" data-to="schedule" data-tab="schedule"><i>🗓</i><span>Розклад</span></a>
      <a data-act="go" data-to="more" data-tab="more"><i>⚙️</i><span>Ще</span></a>
    </nav>
  </div>
  <div id="toast"></div>
  <script>
'use strict';
/* Демо-режим: працює, коли index.html відкрито просто як файл (без сервера).
   Це лише імітація API з тестовими даними; на справжньому сервері не використовується. */
window.DEMO = (() => {
  const KEY = 'starosta_demo_v2';
  const myName = () => { try { return Telegram.WebApp.initDataUnsafe.user.first_name; } catch (e) {} return 'Ви'; };
  const BELLS = {}; ['08:30', '09:25', '10:20', '11:25', '12:30', '13:25', '14:20', '15:15', '16:10'].forEach((s, i) => {
    const [h, m] = s.split(':').map(Number), t = h * 60 + m + 45;
    BELLS[i + 1] = [s, `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`];
  });
  const fresh = () => ({
    n: 100, anchor: null, group: false, was: false, tpl: { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] },
    bells: BELLS, vac: [], ov: {}, hw: [], ann: [], kb: [], deputy: null, sick: false, depSick: false, name: '',
    semStart: null, semEnd: null, pollBefore: 15, skipLimit: 3, members: [], att: {}, el: null
  });
  let D;
  try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!D) { D = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
  const todayS = () => iso(new Date());
  const weekType = ds => (Math.round((pd(mondayOf(ds)) - pd(D.anchor)) / 6048e5) % 2 + 2) % 2 === 0 ? 1 : 2;
  const err = (m, c = 400) => { throw Object.assign(new Error(m), { code: c }); };

  function lessonsFor(ds, withCancelled = true) {
    if (D.semStart && ds < D.semStart || D.semEnd && ds > D.semEnd) return [];
    if (D.vac.some(v => v.start <= ds && ds <= v.end)) return [];
    const wk = weekType(ds), out = [];
    (D.tpl[wdIdx(pd(ds)) + 1] || []).forEach(e => {
      const v = e.alt ? e['w' + wk] : e.w0;
      if (!v || !v.subject) return;
      const b = D.bells[e.num] || ['', ''];
      const l = { num: e.num, subject: v.subject, room: v.room || '', teacher: v.teacher || '', start: b[0], end: b[1], status: 'normal', note: '', week_variant: e.alt ? wk : 0 };
      const o = D.ov[ds + '|' + e.num];
      if (o) {
        l.note = o.note || '';
        if (o.kind === 'cancel') l.status = 'cancelled';
        else if (o.kind === 'move') { l.status = 'moved'; l.orig_start = l.start; l.orig_end = l.end; l.start = o.start; l.end = o.end; if (o.room) l.room = o.room; }
        else { l.status = 'replaced'; if (o.subject) l.subject = o.subject; if (o.room) l.room = o.room; }
      }
      if (l.status === 'cancelled' && !withCancelled) return;
      out.push(l);
    });
    return out.sort((a, b) => (a.start || '99').localeCompare(b.start || '99') || a.num - b.num);
  }
  const lesson = (ds, num) => lessonsFor(ds).find(l => l.num === num);
  const act = () => D.members.filter(m => m.active);

  function seed() { if (!D.anchor) D.anchor = mondayOf(todayS()); }
  const rows = (ds, num) => act().map(m => {
    const a = D.att[ds + '|' + num + '|' + m.id];
    return { member_id: m.id, name: m.name, has_tg: m.has_tg, status: a ? a.s : 'silent', excused: !!(a && a.e), note: '', answered: !!a };
  });
  const summary = (ds, num) => { const c = { present: 0, late: 0, absent: 0, silent: 0, total: 0 }; rows(ds, num).forEach(r => { c[r.status]++; c.total++; }); return c; };
  const lj = (ds, l, sum = true) => sum && l.status !== 'cancelled' ? { ...l, summary: summary(ds, l.num) } : { ...l };
  const hwj = h => ({ ...h, files: h.files || [] });

  function grp() {
    const me = D.members[0], dep = D.members.find(m => m.id === D.deputy);
    return {
      id: 1, name: D.name, code: 'demo1234', invite: 'https://t.me/starosta_demo_bot?start=join_demo1234', role: 'starosta', can_manage: true, is_starosta: true,
      starosta: me.name, deputy: dep ? dep.name : null, acting: null, starosta_sick: D.sick, deputy_sick: D.depSick, i_am_sick: D.sick,
      manager: D.sick && dep && !D.depSick ? dep.name : me.name, week_now: weekType(todayS()), sem_start: D.semStart, sem_end: D.semEnd,
      poll_before: D.pollBefore, skip_limit: D.skipLimit, bells: D.bells, pending: null, i_am_pending: false
    };
  }
  function skips() {
    const per = {};
    Object.entries(D.att).forEach(([k, v]) => {
      const [ds, num, mid] = k.split('|'); const l = lesson(ds, +num);
      const m = D.members.find(x => x.id === +mid);
      if (!l || l.status === 'cancelled' || !m || !m.active) return;
      const s = per[mid] = per[mid] || { total: 0, present: 0, late: 0, absent: 0, excused: 0, silent: 0, sub: {} };
      s.total++;
      if (v.s === 'absent') { if (v.e) s.excused++; else { s.absent++; s.sub[l.subject] = (s.sub[l.subject] || 0) + 1; } } else s[v.s]++;
    });
    const out = act().map(m => {
      const s = per[m.id] || { total: 0, present: 0, late: 0, absent: 0, excused: 0, silent: 0, sub: {} };
      const w = Object.entries(s.sub).sort((a, b) => b[1] - a[1])[0] || [null, 0];
      return { member_id: m.id, name: m.name, total: s.total, present: s.present, late: s.late, absent: s.absent, excused: s.excused, silent: s.silent, worst_subject: w[0], worst_count: w[1], risk: w[1] >= D.skipLimit };
    }).sort((a, b) => b.risk - a.risk || b.absent - a.absent || a.name.localeCompare(b.name));
    const set = new Set(Object.keys(D.att).map(k => k.split('|').slice(0, 2).join('|')));
    return { limit: D.skipLimit, lessons: set.size, students: out, risk_count: out.filter(x => x.risk).length };
  }
  function current() {

const wdIdx = d => (d.getDay() + 6) % 7;

async function api(method, path, body, raw) {
  if (window.DEMO && (DEMO.on || location.protocol === 'file:')) { DEMO.on = true; return DEMO.call(method, path, body, raw); }
  try { return await apiReal(method, path, body, raw); }
  catch (e) {
    if (window.DEMO && path === '/api/me' && e.code !== 401) { DEMO.on = true; return DEMO.call(method, path, body, raw); }
    throw e;
  }
}
async function apiReal(method, path, body, raw) {
  const h = { 'X-Init-Data': (TG && TG.initData) || '' };
  if (DEV) { const [i, ...n] = DEV.split(':'); h['X-Dev-User'] = i + ':' + encodeURIComponent(n.join(':')); }
  const opt = { method, headers: h };
  if (body !== undefined) { h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  if (raw) opt.body = raw;
  const r = await fetch(path, opt);
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error(j.error || 'Щось пішло не так'), { code: r.status });
  return j;
}

async function home() {
  const d = await api('GET', '/api/home');
  const g = d.group; S.home = d;
  const el = d.election, e = el.active;
  let h = `<div class="top"><div class="ava">${esc(initials(g.name))}</div><div class="grow"><h1>${esc(g.name)}</h1>
    <div class="sub">${ROLE[g.role]} · ${d.week}-й тиждень · ${esc(d.date_label)}</div></div></div>`;

  if (g.i_am_pending) h += `<div class="banner vote"><b>🎓 Вас обрано старостою</b>Прийміть посаду, щоб керувати групою.
    <div class="row"><button class="btn pri" data-act="accept">Прийняти старосту</button><button class="btn" data-act="declinePending">Відмовитись</button></div></div>`;
  else if (e && e.status === 'confirm' && e.i_am_candidate) h += `<div class="banner vote"><b>🗳 Група обрала вас старостою</b>Ви точно хочете стати старостою?
    <div class="row"><button class="btn pri" data-act="candYes">Так, готовий(а)</button><button class="btn" data-act="candNo">Ні</button></div></div>`;
  else if (e && e.status === 'voting') h += `<div class="banner vote"><b>🗳 Іде голосування за нового старосту</b>Проголосовано: ${e.voted} з ${e.voters}.
    <div class="row"><button class="btn pri" data-act="go" data-to="role">${e.can_vote ? 'Проголосувати' : 'Переглянути'}</button></div></div>`;
  else if (!g.starosta && !g.pending) h += `<div class="banner warn"><b>У групи немає старости</b>Будь-який учень може розпочати вибори.
    <div class="row"><button class="btn pri" data-act="go" data-to="role">Розпочати вибори</button></div></div>`;
  else if (g.pending) h += `<div class="banner warn"><b>Новий староста — ${esc(g.pending)}</b>Очікуємо, поки він прийме посаду.</div>`;

  if ((d.requests || []).length) h += `<div class="banner vote"><b>➕ Заявки на вступ: ${d.requests.length}</b>${d.requests.map(x => esc(x.name)).join(', ')}<div class="row"><button class="btn pri" data-act="go" data-to="students">Переглянути й прийняти</button></div></div>`;
  if (g.starosta_sick) h += `<div class="banner sick"><b>🤒 Староста хворіє</b>Групу веде: <b style="display:inline">${esc(g.manager || '—')}</b>${g.deputy_sick ? ' (заступник теж хворіє)' : ''}</div>`;
  if (d.vacation) h += `<div class="banner"><b>🏖 ${esc(d.vacation)}</b>Уроків за розкладом немає.</div>`;

  const c = d.current;
  if (g.can_manage && c) {
    const s = c.summary, lbl = d.mode === 'now' ? 'Іде зараз' : d.mode === 'next' ? 'Далі' : 'Було востаннє';
    h += `<div class="card hero"><div class="kicker ${d.mode === 'now' ? '' : 'off'}">ВІДВІДУВАНІСТЬ · ${lbl}</div>
      <h2>${esc(c.subject)}</h2><div class="time">${c.num} урок · ${c.start}–${c.end}${c.room ? ' · каб. ' + esc(c.room) : ''}</div>
      <div class="stats"><div class="stat g"><b>${s.present}</b><small>на уроці</small></div><div class="stat a"><b>${s.late}</b><small>запізнюються</small></div>
      <div class="stat r"><b>${s.absent}</b><small>не прийдуть</small></div><div class="stat m"><b>${s.silent}</b><small>мовчать</small></div></div>
      <a class="linkrow" data-act="go" data-to="lesson/${d.date}/${c.num}">Весь день і відмітки →</a></div>`;
  } else if (c) {
    h += `<div class="card hero"><div class="kicker ${d.mode === 'now' ? '' : 'off'}">${d.mode === 'now' ? 'ЗАРАЗ ЙДЕ' : d.mode === 'next' ? 'НАСТУПНИЙ УРОК' : 'ОСТАННІЙ УРОК'}</div>
      <h2>${esc(c.subject)}</h2><div class="time">${c.num} урок · ${c.start}–${c.end}${c.room ? ' · каб. ' + esc(c.room) : ''}</div></div>`;
  } else if (!d.vacation) h += `<div class="card hero"><h2>Сьогодні уроків немає 🎉</h2><div class="time">${d.next_day ? 'Наступний навчальний день: ' + dlabel(d.next_day, true) : 'Розклад ще не заповнено'}</div></div>`;

  if (d.my_stats && d.my_stats.total) {
    const m = d.my_stats;
    h += `<div class="card"><h3>Моя відвідуваність</h3><div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:6px">
      <div class="stat g"><b>${m.present + m.late}</b><small>був(ла)</small></div><div class="stat r"><b>${m.absent}</b><small>пропусків</small></div>
      <div class="stat m"><b>${m.excused}</b><small>поважних</small></div></div></div>`;
  }

  if (g.can_manage) {
    const mine = g.i_am_sick;
    if (g.is_starosta || g.role === 'deputy') h += `<div class="row" style="margin-bottom:12px"><button class="btn sm2 ${mine ? 'grn' : ''}" data-act="sick" data-v="${mine ? 0 : 1}">${mine ? '💪 Я одужав(ла)' : '🤒 Я захворів(ла)'}</button></div>`;
    h += `<div class="sect"><span>ШВИДКІ ДІЇ</span></div><div class="grid2">
      ${tile('👥', 'Учні', 'Список групи, ролі', 'students')}${tile('🗓', 'Розклад', 'Уроки, кабінети, тижні', 'schedule')}
      ${tile('📊', 'Звіти', 'Excel для директора', 'reports')}${tile('⚠️', 'Прогули', 'Хто на межі', 'skips', d.risk_count || '')}
      ${tile('📋', 'Журнал', 'Відвідуваність по днях', 'journal')}${tile('📢', 'Оголошення', 'Написати групі', 'ann')}
      ${tile('📚', 'База знань', 'Методички, конспекти', 'kb')}${tile('🚪', g.is_starosta ? 'Закінчити' : 'Вибори', g.is_starosta ? 'Передати посаду' : 'Голосування', 'role')}</div>`;
  } else {
    h += `<div class="sect"><span>РОЗДІЛИ</span></div><div class="grid2">
      ${tile('🗓', 'Розклад', 'Уроки й ДЗ', 'schedule')}${tile('📢', 'Оголошення', 'Від старости', 'ann')}
      ${tile('📚', 'База знань', 'Методички, конспекти', 'kb')}${tile('🗳', 'Вибори', 'Голосування за старосту', 'role')}</div>`;
  }

  h += `<div class="sect"><span>СЬОГОДНІ</span><a data-act="go" data-to="schedule">Весь розклад</a></div>`;
  h += d.lessons.length ? `<div class="card pad0">${d.lessons.map(l => lessonRow(l, d.date, { sum: g.can_manage })).join('')}</div>` : `<div class="card">${empty('🌿', 'Уроків немає')}</div>`;
  if (d.homework.length) {
    h += `<div class="sect"><span>ДОМАШНЄ ЗАВДАННЯ</span></div><div class="card">${d.homework.map(hwHtml).join('')}</div>`;
  }
  if (d.announcements.length) {
    h += `<div class="sect"><span>ОГОЛОШЕННЯ</span><a data-act="go" data-to="ann">Усі</a></div><div class="card pad0">${d.announcements.map(annHtml).join('')}</div>`;
  }
  view().innerHTML = h;
}
const tile = (ic, t, s, to, badge) => `<button class="tile" data-act="go" data-to="${to}">${badge ? `<span class="badge">${badge}</span>` : ''}<div class="ic">${ic}</div><b>${t}</b><span>${s}</span></button>`;
const hwHtml = h => `<div class="hw"><b>${esc(h.subject)}</b> · ${dlabel(h.date, true)}<br>${esc(h.text)}${h.files.map(fileHtml).join('')}<small>${esc(h.author)}</small></div>`;
const fileHtml = f => `<div class="file">📎 <span>${esc(f.name)}</span><a href="${f.url}" target="_blank" rel="noopener">Відкрити</a></div>`;
const annHtml = a => `<div class="ann ${a.pinned ? 'pin' : ''}"><b>${a.pinned ? '📌 ' : ''}${esc(a.title)}</b>${a.text ? `<p>${esc(a.text)}</p>` : ''}</div>`;

/* ───────── розклад ───────── */
async function schedule() {
  if (!S.sel) S.sel = S.me.today;
  S.wk = mondayOf(S.sel);
  const w = await api('GET', '/api/week?start=' + S.wk);
  S.weekData = w;
  const g = S.me.group, day = w.days.find(x => x.date === S.sel) || w.days[0];
  let h = head('Розклад', `${day.week}-й тиждень · обраний день: ${dlabel(day.date)}`).replace('data-act="back"', 'data-act="go" data-to="home"');
  h += `<div class="weekbar"><button class="btn sm2" data-act="weekShift" data-n="-7">‹ Тиждень</button>
    <span class="pill ${day.week === 1 ? '' : 'amb'}">${day.week}-й тиждень</span><button class="btn sm2" data-act="weekShift" data-n="7">Тиждень ›</button></div>`;
  h += `<div class="week">${w.days.map(d => {
    const dd = pd(d.date);
    return `<div class="day ${d.date === S.sel ? 'on' : ''} ${d.date === w.today ? 'today' : ''}" data-act="selDay" data-date="${d.date}"><small>${WDS[wdIdx(dd)]}</small><b>${dd.getDate()}</b>${d.lessons.length ? '<i></i>' : ''}</div>`;
  }).join('')}</div>`;
  if (day.vacation) h += `<div class="banner"><b>🏖 ${esc(day.vacation)}</b>Уроків немає.</div>`;
  h += day.lessons.length ? `<div class="card pad0">${day.lessons.map(l => lessonRow(l, day.date)).join('')}</div>` : (day.vacation ? '' : `<div class="card">${empty('🌿', 'У цей день уроків немає')}</div>`);
  if (day.homework.length) h += `<div class="sect"><span>ДОМАШНЄ ЗАВДАННЯ НА ${dlabel(day.date, true).toUpperCase()}</span></div><div class="card">${day.homework.map(hwHtml).join('')}</div>`;
  if (g.can_manage) h += `<button class="btn pri block" data-act="go" data-to="editor/${wdIdx(pd(S.sel)) + 1}" style="margin-top:6px">✏️ Редагувати розклад</button>`;
  view().innerHTML = h;
}

function lessonSheet(date, num) {
  const day = S.weekData.days.find(d => d.date === date); if (!day) return;
  const l = day.lessons.find(x => x.num === num); if (!l) return;
  const g = S.me.group;
  const hws = day.homework.filter(x => x.num === num);
  let h = `<h2>${esc(l.subject)}</h2><p class="sub">${dlabel(date)} · ${l.num} урок · ${l.start}–${l.end}${l.room ? ' · каб. ' + esc(l.room) : ''}${l.teacher ? ' · ' + esc(l.teacher) : ''}</p>`;
  if (l.status === 'cancelled') h += `<div class="banner sick"><b>❌ Урок скасовано</b>${esc(l.note)}</div>`;
  if (l.status === 'moved') h += `<div class="banner warn"><b>🔄 Перенесено</b>Було ${l.orig_start}. ${esc(l.note)}</div>`;
  if (l.status === 'replaced' && l.note) h += `<div class="banner"><b>✏️ Заміна</b>${esc(l.note)}</div>`;
  if (hws.length) h += hws.map(hwHtml).join(''); else h += `<p class="sm">Домашнього завдання немає</p>`;
  if (g.can_manage) {
    h += `<button class="btn block" data-act="hwNew" data-date="${date}" data-num="${num}">📝 Домашнє завдання${hws.length ? ' · ' + hws.length : ''}</button>
      <div class="two"><button class="btn" data-act="moveNew" data-date="${date}" data-num="${num}">🔄 Перенести</button>
      <button class="btn" data-act="replaceNew" data-date="${date}" data-num="${num}">✏️ Замінити</button></div>`;
    h += l.status === 'cancelled' || l.status === 'moved' || l.status === 'replaced'
      ? `<button class="btn grn block" data-act="restore" data-date="${date}" data-num="${num}">↩️ Повернути за розкладом</button>`
      : `<button class="btn red block" data-act="cancelNew" data-date="${date}" data-num="${num}">❌ Скасувати урок</button>`;
    h += `<button class="btn block" data-act="go" data-to="lesson/${date}/${num}">📋 Відмітки на уроці</button>`;
  }
  sheet(h);
}

function uploadBox(kind) {
  return `<div id="fbox"></div><label class="btn block" style="text-align:center;cursor:pointer">📎 Прикріпити фото або файли
    <input type="file" multiple hidden id="fin" data-kind="${kind}"></label>`;
}
function drawFiles() {
  const b = $('#fbox'); if (!b) return;
  b.innerHTML = S.files.map((f, i) => `<div class="file">📎 <span>${esc(f.name)}</span><a data-act="rmFile" data-i="${i}">✕</a></div>`).join('');
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'fin') return;
  const kind = e.target.dataset.kind;
  for (const f of e.target.files) {
    toast('Завантаження: ' + f.name);
    await safe(async () => {
      const r = await api('POST', `/api/upload?kind=${kind}&name=${encodeURIComponent(f.name)}`, undefined, f);
      S.files.push(r); drawFiles(); toast('Файл додано');
    });
  }
  e.target.value = '';
});

async function hwNew(date, num) {
  const day = S.weekData.days.find(d => d.date === date), l = day.lessons.find(x => x.num === num);
  const occ = await api('GET', `/api/occurrences?date=${date}&num=${num}`);
  S.hw = { date, num };
  const hws = day.homework.filter(x => x.num === num);
  sheet(`<h2>Домашнє завдання</h2><p class="sub">${esc(l.subject)}</p>
    <p class="sm">До якого заняття</p><div class="chips" id="occ">${occ.dates.map(o => `<span class="chip ${o.date === date ? 'on' : ''}" data-act="pickOcc" data-date="${o.date}">${o.label}</span>`).join('')}</div>
    <label class="f">Що задали<textarea id="hwtext" placeholder="Наприклад: § 12, вправи 4–8"></textarea></label>
    ${uploadBox('hw')}
    <button class="btn pri block" data-act="hwSave">Додати ДЗ</button>
    ${hws.length ? `<p class="sm" style="margin-top:14px">Уже додано на цей день:</p>${hws.map(h => `<div class="hw">${esc(h.text)}<small><a data-act="hwDel" data-id="${h.id}">Видалити</a></small></div>`).join('')}` : ''}`);
}

function timeForm(l, withTime) {
  return `${withTime ? `<div class="two"><label class="f">Початок<input type="time" id="mst" value="${l.start}"></label><label class="f">Кінець<input type="time" id="men" value="${l.end}"></label></div>` : ''}`;
}
function moveNew(date, num) {
  const l = S.weekData.days.find(d => d.date === date).lessons.find(x => x.num === num);
  sheet(`<h2>Перенести урок</h2><p class="sub">${esc(l.subject)} · ${dlabel(date, true)} · зараз ${l.start}–${l.end}</p>
    ${timeForm(l, true)}<label class="f">Новий кабінет (необовʼязково)<input id="mroom" value="${esc(l.room)}"></label>
    <label class="f">Коментар<input id="mnote" placeholder="Наприклад: через захід"></label>
    <label class="chk"><input type="checkbox" id="mnotify" checked> Повідомити групу</label>
    <button class="btn pri block" data-act="moveSave" data-date="${date}" data-num="${num}">Зберегти й повідомити</button>`);
}
function replaceNew(date, num) {
  const l = S.weekData.days.find(d => d.date === date).lessons.find(x => x.num === num);
  sheet(`<h2>Замінити урок</h2><p class="sub">${esc(l.subject)} · ${dlabel(date, true)}</p>
    <label class="f">Новий предмет<input id="rsub" value="${esc(l.subject)}"></label>
    <label class="f">Кабінет<input id="rroom" value="${esc(l.room)}"></label>
    <label class="f">Коментар<input id="rnote" placeholder="Наприклад: замість вчителя — заміна"></label>
    <label class="chk"><input type="checkbox" id="rnotify" checked> Повідомити групу</label>
    <button class="btn pri block" data-act="replaceSave" data-date="${date}" data-num="${num}">Зберегти</button>`);
}
function cancelNew(date, num) {
  const l = S.weekData.days.find(d => d.date === date).lessons.find(x => x.num === num);
  sheet(`<h2>Скасувати урок?</h2><p class="sub">${esc(l.subject)} · ${dlabel(date, true)}. Уся група отримає сповіщення.</p>
    <label class="f">Коментар (необовʼязково)<input id="cnote" placeholder="Причина"></label>
    <button class="btn red block" data-act="cancelSave" data-date="${date}" data-num="${num}">Скасувати урок</button>
    <button class="btn block" data-act="close">Назад</button>`);
}

/* ───────── редактор розкладу ───────── */
async function editor(wd) {
  S.editWd = Math.min(7, Math.max(1, +wd || 1));
  const t = await api('GET', '/api/template');
  S.tpl = t;
  S.edit = JSON.parse(JSON.stringify(t.days[S.editWd] || []));
  drawEditor();
}
function drawEditor() {
  const tabs = WDS.map((w, i) => `<span class="chip ${i + 1 === S.editWd ? 'on' : ''}" data-act="editDay" data-wd="${i + 1}">${w}</span>`).join('');
  const rows = S.edit.map((e, i) => {
    const v = (k, f) => esc((e[k] || {})[f] || '');
    const block = (k, label) => `<div class="${label ? 'var' : ''}">${label ? `<div class="sm">${label}</div>` : ''}
      <div class="two"><input class="in" data-k="${k}" data-f="subject" data-i="${i}" placeholder="Предмет" value="${v(k, 'subject')}">
      <input class="in" data-k="${k}" data-f="room" data-i="${i}" placeholder="Кабінет" value="${v(k, 'room')}"></div></div>`;
    return `<div class="ed"><div class="hd"><input class="in n" type="number" min="1" max="12" data-i="${i}" data-f="num" value="${e.num}">
      <span class="sm" style="flex:1">${(S.tpl.bells[e.num] || ['', ''])[0]}${S.tpl.bells[e.num] ? '–' + S.tpl.bells[e.num][1] : ''}</span>
      <label class="chk" style="margin:0"><input type="checkbox" data-i="${i}" data-f="alt" ${e.alt ? 'checked' : ''}> по тижнях</label>
      <button class="del" data-act="edDel" data-i="${i}">✕</button></div>
      ${e.alt ? block('w1', '1-й тиждень') + block('w2', '2-й тиждень') : block('w0')}</div>`;
  }).join('');
  view().innerHTML = head('Розклад: ' + WD[S.editWd - 1], 'Впишіть уроки по номерах: предмет і кабінет. Якщо на 1-му й 2-му тижні різні предмети — увімкніть «по тижнях».').replace('data-act="back"', 'data-act="go" data-to="schedule"') +
    `<div class="chips">${tabs}</div>${rows || empty('📝', 'Уроків ще немає')}
    <div class="two"><button class="btn" data-act="edAdd">＋ Додати урок</button><button class="btn" data-act="edCopy">⧉ Скопіювати з…</button></div>
    <button class="btn pri block" style="margin-top:12px" data-act="edSave">Зберегти ${WD[S.editWd - 1]}</button>`;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || t.dataset.i === undefined || !S.edit) return;
  const row = S.edit[+t.dataset.i]; if (!row) return;
  if (t.dataset.k) { row[t.dataset.k] = row[t.dataset.k] || {}; row[t.dataset.k][t.dataset.f] = t.value; }
  else if (t.dataset.f === 'num') row.num = +t.value || 1;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f === 'alt' && S.edit) {
    const row = S.edit[+t.dataset.i];
    row.alt = t.checked;
    if (t.checked) { row.w1 = row.w1 || row.w0 || {}; row.w2 = row.w2 || {}; }
    else { row.w0 = row.w1 || row.w2 || {}; }
    drawEditor();
  }
});

/* ───────── учні ───────── */
async function students() {
  const r = await api('GET', '/api/students');
  const g = r.group; S.stu = r.items;
  const act = r.items.filter(x => x.active), off = r.items.filter(x => !x.active);
  const row = s => {
    const tags = [];
    if (s.role === 'starosta') tags.push('<span class="pill">староста</span>');
    if (s.role === 'deputy') tags.push('<span class="pill blu">заступник</span>');
    if (s.role === 'acting') tags.push('<span class="pill amb">заміна</span>');
    if (s.sick) tags.push('<span class="pill red">хворіє</span>');
    if (!s.has_tg) tags.push('<span class="pill gry">без Telegram</span>');
    return `<div class="stu" data-act="stuOpen" data-id="${s.id}"><div class="av2">${esc(initials(s.name))}</div><div class="t"><b>${esc(s.name)}${s.me ? ' (ви)' : ''}</b></div>${tags.join(' ')}</div>`;
  };
  let h = `<div class="pagehead"><h1>Учні</h1></div><p class="lead">${act.length} у групі · Керує: ${esc(g.manager || '—')}</p>`;
  h += `<div class="row" style="margin-bottom:12px"><button class="btn pri" data-act="invite">🔗 Запросити</button></div>`;
  if (g.can_manage) {
    const rq = (await api('GET', '/api/requests')).items;

const sumHtml = s => `<div class="stat g"><b>${s.present}</b><small>на уроці</small></div><div class="stat a"><b>${s.late}</b><small>запізнюються</small></div><div class="stat r"><b>${s.absent}</b><small>не прийдуть</small></div><div class="stat m"><b>${s.silent}</b><small>мовчать</small></div>`;

async function mark(id, st, excused) {

async function skips() {
  const r = await api('GET', '/api/skips');
  const bar = s => { const t = Math.max(1, s.total); const p = n => (n / t * 100).toFixed(1) + '%';
    return `<div class="bar"><i style="width:${p(s.present + s.late)};background:var(--green)"></i><i style="width:${p(s.silent)};background:#4a4a66"></i><i style="width:${p(s.excused)};background:var(--blue)"></i><i style="width:${p(s.absent)};background:var(--red)"></i></div>`; };
  view().innerHTML = head('Прогули', `Поріг: ${r.limit} пропуски з одного предмета`).replace('data-act="back"', 'data-act="go" data-to="home"') +
    `<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div class="stat r"><b>${r.risk_count}</b><small>у групі ризику</small></div><div class="stat m"><b>${r.students.length}</b><small>учнів</small></div><div class="stat g"><b>${r.lessons}</b><small>уроків пройшло</small></div></div>` +
    `<div class="card pad0">${r.students.map(s => `<div class="sk ${s.risk ? 'risk' : ''}"><div class="l"><b>${esc(s.name)}</b>
      <span>${s.risk ? `<span class="pill red">на межі · ${esc(s.worst_subject)} ${s.worst_count}</span>` : (s.absent ? `<span class="pill gry">${s.absent} прог.</span>` : '')}${s.excused ? ` <span class="pill blu">${s.excused} поваж.</span>` : ''}</span></div>
      ${bar(s)}<div class="sm" style="margin-top:4px">був(ла) ${s.present + s.late} з ${s.total}</div></div>`).join('') || empty('👥', 'Поки немає даних')}</div>`;

  } else if (!el.i_am_pending && !el.pending_id) h += `<div class="card">${empty('🗳', 'Голосування зараз не триває')}</div>`;

  selDay: el => { S.sel = el.dataset.date; render(); },
  hwNew: el => safe(() => hwNew(el.dataset.date, +el.dataset.num)),
  pickOcc: el => { $$('#occ .chip').forEach(c => c.classList.remove('on')); el.classList.add('on'); S.hw.date = el.dataset.date; },
  rmFile: el => { S.files.splice(+el.dataset.i, 1); drawFiles(); },
  hwSave: () => safe(async () => { await api('POST', '/api/homework', { date: S.hw.date, num: S.hw.num, text: val('hwtext'), files: S.files.map(f => f.id) }); closeSheet(); toast('ДЗ додано ✓'); render(); }),
  hwDel: el => safe(async () => { await api('DELETE', '/api/homework/' + el.dataset.id); closeSheet(); render(); }),
  moveNew: el => moveNew(el.dataset.date, +el.dataset.num),
  replaceNew: el => replaceNew(el.dataset.date, +el.dataset.num),
  cancelNew: el => cancelNew(el.dataset.date, +el.dataset.num),
  moveSave: el => safe(async () => { await api('POST', '/api/override', { date: el.dataset.date, num: +el.dataset.num, kind: 'move', start: val('mst'), end: val('men'), room: val('mroom'), note: val('mnote'), notify: $('#mnotify').checked }); closeSheet(); toast('Перенесено, група повідомлена'); render(); }),
  replaceSave: el => safe(async () => { await api('POST', '/api/override', { date: el.dataset.date, num: +el.dataset.num, kind: 'replace', subject: val('rsub'), room: val('rroom'), note: val('rnote'), notify: $('#rnotify').checked }); closeSheet(); toast('Збережено'); render(); }),
  cancelSave: el => safe(async () => { await api('POST', '/api/override', { date: el.dataset.date, num: +el.dataset.num, kind: 'cancel', note: val('cnote') }); closeSheet(); toast('Урок скасовано, група повідомлена'); render(); }),
  restore: el => safe(async () => { await api('DELETE', `/api/override?date=${el.dataset.date}&num=${el.dataset.num}`); closeSheet(); toast('Повернено за розкладом'); render(); }),
  // редактор
  editDay: el => { S.editWd = +el.dataset.wd; editor(S.editWd); },
  edAdd: () => { const used = S.edit.map(x => x.num); let n = 1; while (used.includes(n)) n++; S.edit.push({ num: n, alt: false, w0: { subject: '', room: '' } }); drawEditor(); },
  edDel: el => { S.edit.splice(+el.dataset.i, 1); drawEditor(); },
  edCopy: () => {
    const opts = WDS.map((w, i) => (i + 1 !== S.editWd && (S.tpl.days[i + 1] || []).length) ? `<button class="btn block" data-act="edCopyFrom" data-wd="${i + 1}">${cap(WD[i])}</button>` : '').join('');
    sheet(`<h2>Скопіювати з…</h2><p class="sub">Розклад обраного дня замінить поточний.</p>${opts || '<p class="sm">Інших днів ще немає</p>'}`);
  },
  edCopyFrom: el => { S.edit = JSON.parse(JSON.stringify(S.tpl.days[+el.dataset.wd])); closeSheet(); drawEditor(); },
  edSave: () => safe(async () => {
    const lessons = S.edit.map(e => ({ num: e.num, alt: !!e.alt, w0: e.w0, w1: e.w1, w2: e.w2 }));
    await api('POST', '/api/template/day', { weekday: S.editWd, lessons });
    toast('Розклад збережено ✓'); editor(S.editWd);
  }),
  // учні
  invite: () => {
    const link = S.me.group.invite, text = `Приєднуйся до групи «${S.me.group.name}» у Староста боті`;
    if (TG && TG.openTelegramLink) TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(text));
    else { navigator.clipboard && navigator.clipboard.writeText(link); toast('Посилання скопійовано'); }
  },
  stuOpen: el => stuOpen(el.dataset.id),
  stuRename: el => {
    const s = (S.stu || []).find(x => x.id === +el.dataset.id) || { name: S.me.member_name };
    sheet(`<h2>Змінити ПІБ</h2><label class="f">ПІБ<input id="rname" maxlength="60" value="${esc(s.name)}"></label><button class="btn pri block" data-act="renameSave" data-id="${el.dataset.id}" data-me="${el.dataset.me || ''}">Зберегти</button>`);
  },
  renameSave: el => safe(async () => {
    const mine = el.dataset.me || (S.stu || []).find(x => x.id === +el.dataset.id && x.me);
    if (mine) await api('PUT', '/api/me/name', { name: val('rname') }); else await api('PUT', '/api/students/' + el.dataset.id, { name: val('rname') });
    closeSheet(); await reloadMe(); render();
  }),
  setDeputy: el => safe(async () => { await api('POST', '/api/deputy', { member_id: +el.dataset.id || null }); closeSheet(); toast(+el.dataset.id ? 'Заступника призначено' : 'Заступника знято'); render(); }),
  setActing: el => safe(async () => { await api('POST', '/api/acting', { member_id: +el.dataset.id }); closeSheet(); toast('Заміну призначено'); render(); }),
  stuActive: el => safe(async () => { await api('POST', `/api/students/${el.dataset.id}/active`, { active: +el.dataset.v === 1 }); closeSheet(); render(); }),
  stuDel: el => confirmSheet('Видалити учня?', 'Разом із його відмітками відвідуваності. Це незворотно.', 'Видалити', async () => { await api('DELETE', '/api/students/' + el.dataset.id); render(); }, true),
  // журнал
  jShift: el => { S.jdate = addDays(S.jdate, +el.dataset.n); render(); },
  mark: el => safe(() => mark(el.dataset.id, el.dataset.st)),
  excuse: el => safe(() => mark(el.dataset.id, 'absent', +el.dataset.v === 1)),
  period: el => { S.period = el.dataset.p; reports(); },
  sendReport: el => safe(async () => { el.disabled = true; const r = await api('POST', '/api/report/send', { period: S.period }).finally(() => el.disabled = false); toast(`Звіт надіслано в чат (${r.lessons} уроків)`); }),
  // оголошення, база знань
  annNew: () => sheet(`<h2>Нове оголошення</h2><p class="sub">Прийде всім учням у бот.</p><label class="f">Заголовок<input id="at" maxlength="80"></label><label class="f">Текст<textarea id="ax"></textarea></label>
    <label class="chk"><input type="checkbox" id="ap"> Закріпити зверху</label><button class="btn pri block" data-act="annSave">Опублікувати</button>`),
  annSave: () => safe(async () => { await api('POST', '/api/announcements', { title: val('at'), text: val('ax'), pinned: $('#ap').checked }); closeSheet(); toast('Опубліковано'); render(); }),
  annPin: el => safe(async () => { await api('POST', `/api/announcements/${el.dataset.id}/pin`, {}); render(); }),
  annDel: el => safe(async () => { await api('DELETE', '/api/announcements/' + el.dataset.id); render(); }),
  kbNew: () => sheet(`<h2>Новий матеріал</h2><label class="f">Предмет<input id="kbs" list="kbl" placeholder="Оберіть або впишіть"><datalist id="kbl">${(S.kbSubjects || []).map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
    <label class="f">Назва<input id="kbt" maxlength="120" placeholder="Шпаргалка, конспект…"></label>${uploadBox('kb')}<button class="btn pri block" data-act="kbSave">Додати</button>`),
  kbSave: () => safe(async () => { await api('POST', '/api/kb', { subject: val('kbs'), title: val('kbt'), files: S.files.map(f => f.id) }); closeSheet(); toast('Додано'); render(); }),
  kbDel: el => safe(async () => { await api('DELETE', '/api/kb/' + el.dataset.id); render(); }),
  // вибори
  elStart: () => confirmSheet(S.me.group.is_starosta ? 'Закінчити бути старостою?' : 'Розпочати вибори?', S.me.group.is_starosta ? 'Усі учні отримають голосування за нового старосту. Вас і вашого заступника буде знято, коли обрана людина погодиться.' : 'Усі учні групи отримають бюлетень.', 'Так, розпочати', async () => { await api('POST', '/api/election/start'); toast('Голосування розпочато'); render(); }, true),
  vote: el => safe(async () => { await api('POST', '/api/election/vote', { candidate: +el.dataset.id }); toast('Голос враховано ✓'); render(); }),
  elClose: () => safe(async () => { await api('POST', '/api/election/close'); render(); }),
  elCancel: () => confirmSheet('Скасувати вибори?', 'Ви залишитесь старостою.', 'Скасувати вибори', async () => { await api('POST', '/api/election/cancel'); await reloadMe(); render(); }, true),
  // налаштування
  weekNow: el => safe(async () => { await api('POST', '/api/settings', { week_now: +el.dataset.w }); await reloadMe(); toast('Збережено'); render(); }),
  saveSettings: () => safe(async () => {
    const bells = {};
    $$('[data-bell]').forEach(i => { (bells[i.dataset.bell] = bells[i.dataset.bell] || ['', ''])[+i.dataset.i] = i.value; });
    await api('POST', '/api/settings', { name: val('s_name'), sem_start: val('s_ss'), sem_end: val('s_se'), poll_before: +val('s_pb'), skip_limit: +val('s_sl'), bells });
    await reloadMe(); toast('Збережено ✓'); render();
  }),
  vacAdd: () => safe(async () => { await api('POST', '/api/vacations', { start: val('v_s'), end: val('v_e'), title: val('v_t') || 'Канікули' }); render(); }),
  vacDel: el => safe(async () => { await api('DELETE', '/api/vacations/' + el.dataset.id); render(); }),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

/* ───────── старт ───────── */
(async function boot() {
  try {
    await reloadMe();
    if (window.DEMO && DEMO.on) { const r = document.createElement('div'); r.className = 'ribbon'; r.textContent = 'ДЕМО · тестові дані, зберігаються лише в цьому браузері'; document.body.appendChild(r); }
    if (!location.hash) location.hash = '#/home';
    render();
  } catch (e) {
    if (e.code === 401) renderLogin();
    else view().innerHTML = `<div class="boot"><div class="logo">⚠️</div><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Оновити</button></div>`;
  }
})();

</script>
</body>
</html>
